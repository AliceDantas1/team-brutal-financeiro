<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Brutal</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#111;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:#222;
            padding:30px;
            border-radius:15px;
            width:350px;
            text-align:center;
        }

        h1{
            color:#f5b400;
        }

        input{
            width:90%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
        }

        button{
            width:95%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            background:#f5b400;
            font-weight:bold;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🥊 Team Brutal</h1>

    <h3>Sistema de Mensalidades</h3>

    <input type="email" placeholder="Email">

    <input type="password" placeholder="Senha">

    <button>Entrar</button>

</div>

</body>
</html>
