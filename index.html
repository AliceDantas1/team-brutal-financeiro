<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Brutal</title>

<style>
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}
.login-area{height:100vh;display:flex;justify-content:center;align-items:center}
.card,.box{background:#222;padding:25px;border-radius:15px;margin-bottom:20px}
.card{width:360px}
h1{color:#f5b400;text-align:center}
input,select,button,textarea{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;box-sizing:border-box}
button{background:#f5b400;font-weight:bold;cursor:pointer}
.painel{display:none;padding:25px}
.topo{display:flex;justify-content:space-between;align-items:center}
.topo button{width:auto}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}
.dash-card{background:#333;padding:18px;border-radius:12px;text-align:center}
.dash-card h3{margin:0;color:#f5b400}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border-bottom:1px solid #444;padding:10px;text-align:left}
.pendente{color:#ff5555;font-weight:bold}
.pago{color:#4ade80;font-weight:bold}
.acoes button{margin:3px;width:auto;padding:8px}
@media(max-width:700px){
  table{font-size:13px}
  th,td{padding:6px}
}
</style>
</head>

<body>

<div class="login-area" id="loginArea">
  <div class="card">
    <h1>🥊 Team Brutal</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">
    <button id="btnLogin">Entrar</button>
    <p id="msg"></p>
  </div>
</div>

<div class="painel" id="painel">

  <div class="topo">
    <h1>🥊 Team Brutal</h1>
    <button id="btnSair">Sair</button>
  </div>

  <div class="dashboard">
    <div class="dash-card">
      <h3 id="totalAlunos">0</h3>
      <p>Alunos</p>
    </div>
    <div class="dash-card">
      <h3 id="totalPagos">0</h3>
      <p>Pagos no mês</p>
    </div>
    <div class="dash-card">
      <h3 id="totalPendentes">0</h3>
      <p>Pendentes</p>
    </div>
    <div class="dash-card">
      <h3 id="receitaMes">R$ 0,00</h3>
      <p>Receita do mês</p>
    </div>
  </div>

  <div class="box">
    <h2>Cadastrar aluno</h2>

    <input id="nome" placeholder="Nome do aluno">
    <input id="telefone" placeholder="Telefone/WhatsApp">
    <input id="valor" type="number" value="130" placeholder="Mensalidade">

    <select id="vencimento">
      <option value="10">Vencimento dia 10</option>
      <option value="20">Vencimento dia 20</option>
    </select>

    <textarea id="obs" placeholder="Observações"></textarea>

    <button id="btnSalvarAluno">Salvar aluno</button>
    <p id="msgAluno"></p>
  </div>

  <div class="box">
    <h2>Alunos cadastrados</h2>

    <input id="pesquisa" placeholder="🔍 Pesquisar aluno pelo nome">

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Mensalidade</th>
          <th>Venc.</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaAlunos"></tbody>
    </table>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL6b1pV6zSvZTxO1DDMW7OZlv2_3pq_GE",
  authDomain: "teambrutal-7e2d7.firebaseapp.com",
  projectId: "teambrutal-7e2d7",
  storageBucket: "teambrutal-7e2d7.firebasestorage.app",
  messagingSenderId: "488619314946",
  appId: "1:488619314946:web:ccf429f7d3f3333d203c1b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let alunos = [];

const loginArea = document.getElementById("loginArea");
const painel = document.getElementById("painel");
const msg = document.getElementById("msg");
const msgAluno = document.getElementById("msgAluno");
const listaAlunos = document.getElementById("listaAlunos");

function mesAtual(){
  const hoje = new Date();
  return hoje.getFullYear() + "-" + String(hoje.getMonth()+1).padStart(2,"0");
}

document.getElementById("btnLogin").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    await signInWithEmailAndPassword(auth, email, senha);
    loginArea.style.display = "none";
    painel.style.display = "block";
    carregarAlunos();
  } catch(error) {
    msg.innerHTML = "❌ Email ou senha inválidos";
  }
});

document.getElementById("btnSair").addEventListener("click", async () => {
  await signOut(auth);
  painel.style.display = "none";
  loginArea.style.display = "flex";
});

document.getElementById("btnSalvarAluno").addEventListener("click", async () => {
  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const valor = Number(document.getElementById("valor").value);
  const vencimento = document.getElementById("vencimento").value;
  const obs = document.getElementById("obs").value.trim();

  if(!nome || !telefone || !valor){
    msgAluno.innerHTML = "❌ Preencha nome, telefone e mensalidade.";
    return;
  }

  try {
    await addDoc(collection(db, "alunos"), {
      nome,
      telefone,
      valor,
      vencimento,
      obs,
      statusAtual: "pendente",
      ultimoPagamento: "",
      criadoEm: serverTimestamp(),
      historicoPagamentos: {}
    });

    msgAluno.innerHTML = "✅ Aluno cadastrado com sucesso!";

    document.getElementById("nome").value = "";
    document.getElementById("telefone").value = "";
    document.getElementById("valor").value = "130";
    document.getElementById("vencimento").value = "10";
    document.getElementById("obs").value = "";

    carregarAlunos();

  } catch(error) {
    msgAluno.innerHTML = "❌ Erro ao salvar aluno.";
  }
});

async function carregarAlunos(){
  alunos = [];
  const querySnapshot = await getDocs(collection(db, "alunos"));

  querySnapshot.forEach((docSnap) => {
    alunos.push({
      id: docSnap.id,
      ...docSnap.data()
    });
  });

  renderizarAlunos();
}

function renderizarAlunos(){
  const busca = document.getElementById("pesquisa").value.toLowerCase();
  listaAlunos.innerHTML = "";

  let pagos = 0;
  let pendentes = 0;
  let receita = 0;

  const mes = mesAtual();

  const filtrados = alunos.filter(aluno =>
    aluno.nome.toLowerCase().includes(busca)
  );

  alunos.forEach(aluno => {
    const pagoMes = aluno.historicoPagamentos && aluno.historicoPagamentos[mes];

    if(pagoMes){
      pagos++;
      receita += Number(aluno.valor || 0);
    }else{
      pendentes++;
    }
  });
  filtrados.forEach((aluno) => {
    const pagoMes = aluno.historicoPagamentos && aluno.historicoPagamentos[mes];

    const hoje = new Date();
    const diaHoje = hoje.getDate();

    let situacao = aluno.situacao || "ativo";

    if(situacao !== "suspenso"){
      if(!pagoMes && diaHoje > Number(aluno.vencimento)){
        situacao = "atraso";
      }else{
        situacao = "ativo";
      }
    }

    const telefoneLimpo = String(aluno.telefone || "").replace(/\D/g, "");

    listaAlunos.innerHTML += `
      <tr>
        <td>${aluno.nome}</td>
        <td>${aluno.telefone}</td>
        <td>R$ ${Number(aluno.valor).toFixed(2)}</td>
        <td>Dia ${aluno.vencimento}</td>

        <td class="${pagoMes ? "pago" : "pendente"}">
          ${pagoMes ? "Pago" : "Pendente"}
        </td>

        <td>
          ${
            situacao === "suspenso"
            ? "🔴 Suspenso"
            : situacao === "atraso"
            ? "🟡 Em atraso"
            : "🟢 Ativo"
          }
        </td>

        <td class="acoes">
          ${
            pagoMes
            ? `<span class="pago">Pago em ${aluno.ultimoPagamento || ""}</span>`
            : `<button onclick="receberPagamento('${aluno.id}')">Receber</button>`
          }

          <button onclick="abrirWhatsApp('${telefoneLimpo}', '${aluno.nome}')">WhatsApp</button>

          ${
            situacao === "suspenso"
            ? `<button onclick="reativarAluno('${aluno.id}')">Reativar</button>`
            : `<button onclick="suspenderAluno('${aluno.id}')">Suspender</button>`
          }

          <button onclick="excluirAluno('${aluno.id}', '${aluno.nome}')">Excluir</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("totalAlunos").innerText = alunos.length;
  document.getElementById("totalPagos").innerText = pagos;
  document.getElementById("totalPendentes").innerText = pendentes;
  document.getElementById("receitaMes").innerText =
    receita.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}

window.receberPagamento = async function(id){
  const aluno = alunos.find(a => a.id === id);
  if(!aluno) return;

  const mes = mesAtual();

  const novoHistorico = {
    ...(aluno.historicoPagamentos || {}),
    [mes]: {
      pago: true,
      data: new Date().toLocaleDateString("pt-BR"),
      valor: Number(aluno.valor || 0)
    }
  };

  await updateDoc(doc(db, "alunos", id), {
    statusAtual: "pago",
    ultimoPagamento: new Date().toLocaleDateString("pt-BR"),
    historicoPagamentos: novoHistorico
  });

  carregarAlunos();
}


window.abrirWhatsApp = function(telefone, nome){
  if(!telefone){
    alert("Esse aluno não tem telefone cadastrado.");
    return;
  }

  const mensagem = `Olá, ${nome}!

Sua mensalidade da Team Brutal encontra-se pendente.

🥊 Team Brutal`;

  const link = `https://wa.me/55${telefone}?text=${encodeURIComponent(mensagem)}`;
  window.open(link, "_blank");
}

window.suspenderAluno = async function(id){
  await updateDoc(doc(db, "alunos", id), {
    situacao: "suspenso"
  });

  carregarAlunos();
}

window.reativarAluno = async function(id){
  await updateDoc(doc(db, "alunos", id), {
    situacao: "ativo"
  });

  carregarAlunos();
}

window.excluirAluno = async function(id, nome){
  if(!confirm("Excluir " + nome + "?")) return;

  await deleteDoc(doc(db, "alunos", id));

  carregarAlunos();
}
}

window.abrirWhatsApp = function(telefone, nome){
  if(!telefone){
    alert("Esse aluno não tem telefone cadastrado.");
    return;
  }

  const mensagem = `Olá, ${nome}!

Sua mensalidade da Team Brutal encontra-se pendente.

🥊 Team Brutal`;

  const link = `https://wa.me/55${telefone}?text=${encodeURIComponent(mensagem)}`;
  window.open(link, "_blank");
}

window.suspenderAluno = async function(id){
  await updateDoc(doc(db, "alunos", id), {
    situacao: "suspenso"
  });

  carregarAlunos();
}

window.reativarAluno = async function(id){
  await updateDoc(doc(db, "alunos", id), {
    situacao: "ativo"
  });

  carregarAlunos();
}

window.excluirAluno = async function(id, nome){
  if(!confirm("Excluir " + nome + "?")) return;

  await deleteDoc(doc(db, "alunos", id));

  carregarAlunos();
}
window.abrirWhatsApp = function(telefone, nome){
  if(!telefone){
    alert("Esse aluno não tem telefone cadastrado.");
    return;
  }

  const mensagem = `Olá, ${nome}!

Sua mensalidade da Team Brutal encontra-se pendente.

🥊 Team Brutal`;

  const link = `https://wa.me/55${telefone}?text=${encodeURIComponent(mensagem)}`;
  window.open(link, "_blank");
}

window.suspenderAluno = async function(id){
  await updateDoc(doc(db, "alunos", id), {
    situacao: "suspenso"
  });

  carregarAlunos();
}

window.reativarAluno = async function(id){
  await updateDoc(doc(db, "alunos", id), {
    situacao: "ativo"
  });

  carregarAlunos();
}

window.excluirAluno = async function(id, nome){
  if(!confirm("Excluir " + nome + "?")) return;

  await deleteDoc(doc(db, "alunos", id));

  carregarAlunos();
}

document.getElementById("pesquisa").addEventListener("input", renderizarAlunos);

</script>



</body>
</html>
