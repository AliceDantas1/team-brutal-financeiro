<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Brutal</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.login-area{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:360px;
    background:#222;
    padding:30px;
    border-radius:15px;
}

h1{
    color:#f5b400;
    text-align:center;
}

input, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    background:#f5b400;
    font-weight:bold;
    cursor:pointer;
}

#msg{
    text-align:center;
    margin-top:15px;
}

.painel{
    padding:25px;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.box{
    background:#222;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="login-area" id="loginArea">
    <div class="card">
        <h1>🥊 Team Brutal</h1>

        <input type="email" id="email" placeholder="Email">
        <input type="password" id="senha" placeholder="Senha">

        <button id="btnLogin">Entrar</button>

        <p id="msg"></p>
    </div>
</div>

<div class="painel" id="painel" style="display:none;">

    <div class="topo">
        <h1>🥊 Team Brutal</h1>
        <button id="btnSair" style="width:auto;">Sair</button>
    </div>

    <div class="box">
        <h2>Bem-vinda ao sistema</h2>
        <p>Login conectado ao Firebase com sucesso.</p>
    </div>

    <div class="box">
        <h2>Próxima etapa</h2>
        <button>Cadastrar aluno</button>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL6b1pV6zSvZTxO1DDMW7OZlv2_3pq_GE",
  authDomain: "teambrutal-7e2d7.firebaseapp.com",
  projectId: "teambrutal-7e2d7",
  storageBucket: "teambrutal-7e2d7.firebasestorage.app",
  messagingSenderId: "488619314946",
  appId: "1:488619314946:web:ccf429f7d3f3333d203c1b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginArea = document.getElementById("loginArea");
const painel = document.getElementById("painel");
const msg = document.getElementById("msg");

document.getElementById("btnLogin").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {
        await signInWithEmailAndPassword(auth, email, senha);

        loginArea.style.display = "none";
        painel.style.display = "block";

    } catch(error) {
        msg.innerHTML = "❌ Email ou senha inválidos";
        console.error(error);
    }
});

document.getElementById("btnSair").addEventListener("click", async () => {
    await signOut(auth);

    painel.style.display = "none";
    loginArea.style.display = "flex";
});

</script>

</body>
</html>
